{% extends 'base.html' %}
{% block titre %}Connexion{% endblock %}
{% block contenu %}
<section class="carte carte-etroite">
    <h1>Bienvenue sur le portail de reservation GUDLFT !</h1>
    <p>Entrez l'email du secretaire de votre club pour continuer :</p>
    <form action="showSummary" method="post" class="formulaire">
        <label for="email">Email :</label>
        <input type="email" name="email" id="email" required/>
        <button type="submit">Se connecter</button>
    </form>
    <p class="aide"><a href="{{url_for('tableauPoints')}}">Voir les points des clubs</a></p>
</section>
{% endblock %}
