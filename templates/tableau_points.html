{% extends 'base.html' %}
{% block titre %}Points des clubs{% endblock %}
{% block contenu %}
<h1>Points des clubs</h1>
<table class="tableau">
    <tr>
        <th>Club</th>
        <th>Points</th>
    </tr>
    {% for club in clubs %}
    <tr>
        <td>{{club['name']}}</td>
        <td>{{club['points']}}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
